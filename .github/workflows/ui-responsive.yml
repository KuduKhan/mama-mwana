name: UI responsive browser smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application
        run: npm install --no-audit --no-fund
      - name: Install pinned visual-test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise responsive demo without patient data
        run: npx playwright test -c playwright.config.mjs
        env:
          CI: true
      - name: Keep failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mamamwana-demo-ui-artifacts
          path: test-results/
          retention-days: 3
