name: UI responsive browser smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise responsive demo without patient data
        run: npx playwright test -c playwright.config.mjs --max-failures=1
        env:
          CI: true
      - name: Preserve original-style demo screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mamamwana-original-ui-review
          path: test-results/**/original-home-*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Keep failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mamamwana-demo-ui-artifacts
          path: test-results/
          retention-days: 3
