name: CI — Typecheck, Test, Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reject administrative credentials in browser source
        run: npm run security:client
      - name: Check clinical SQL authorization contracts
        run: npm run security:sql
      - name: Validate normalized local migration workspace
        run: npm run test:local:prepare
      - name: Check local Auth fixture runner syntax
        run: node --check scripts/run-local-security.mjs && node --check scripts/prepare-local-migrations.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Domain unit tests
        run: npm run test
      - name: Production build
        run: npm run build
