name: CI — Typecheck, Test, Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reject administrative credentials in browser source
        run: npm run security:client
      - name: Check clinical SQL authorization contracts
        run: npm run security:sql
      - name: Review privileged clinical RPC source-level boundaries
        run: npm run security:rpc-review
      - name: Assert v2.1 integrations remain locked and clinical release remains NO-GO
        run: npm run security:v21
      - name: Enforce non-diagnostic tracker authorization boundary
        run: node scripts/check-personal-tracker-security.mjs
      - name: Verify synthetic backup cryptographic primitives
        run: node --test scripts/disposable-backup-crypto.test.mjs
      - name: Validate normalized local migration workspace
        run: npm run test:local:prepare
      - name: Check local Auth fixture runner syntax
        run: node --check scripts/run-local-security.mjs && node --check scripts/prepare-local-migrations.mjs
      - name: Verify RC.1 acceptances are independently pending and clinician integration locked
        run: npm run release:rc:status
      - name: Verify fail-closed v2 release readiness
        run: npm run release:v2:status
      - name: Verify preview safety, public learning and offline boundaries
        run: npm run release:v2:privacy-safety
      - name: Typecheck
        run: npm run typecheck
      - name: Domain unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Initial JavaScript performance budget
        run: npm run quality:bundle
      - name: Verify feature-level code splitting and route budgets
        run: npm run quality:routes
      - name: Verify beta.7–beta.12 experience and accessibility release contracts
        run: npm run quality:experience
      - name: Produce sanitized v2 acceptance packet (not a human approval)
        run: npm run release:v2:acceptance-packet
      - name: Preserve sanitized acceptance-readiness packet
        uses: actions/upload-artifact@v4
        with:
          name: mamamwana-v2-acceptance-readiness-${{ github.run_id }}
          path: .mamamwana-evidence/v200-acceptance-readiness.json
          retention-days: 7
          if-no-files-found: error
      - name: Emit sanitized v2 engineering evidence
        run: npm run release:v2:technical-evidence
      - name: Preserve non-clinical technical evidence
        uses: actions/upload-artifact@v4
        with:
          name: mamamwana-v2-engineering-evidence-${{ github.run_id }}
          path: .mamamwana-evidence/build.json
          retention-days: 7
          if-no-files-found: error
